<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postshow · the AI teammate for customer intelligence</title>
    <meta
      name="description"
      content="Postshow samples product behavior, investigates why users convert, stall, or churn, and hands you drafted emails, tickets, and plays. Open source, free with your own keys, hosted from $99/mo."
    />
    <link rel="canonical" href="https://postshow.io" />
    <meta name="theme-color" content="#f7f7f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Postshow · the AI teammate for customer intelligence" />
    <meta
      property="og:description"
      content="It samples product behavior, investigates why it changed, and hands you the next move as a draft. You approve. It learns. Open source, by Eventools LLC."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://postshow.io" />
    <meta property="og:site_name" content="Postshow" />
    <meta property="og:image" content="https://postshow.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://postshow.io/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Postshow",
        "url": "https://postshow.io",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web browser; macOS and Windows desktop app; CLI on Node.js-supported macOS, Windows, and Linux",
        "description": "An AI customer-intelligence teammate: it samples product behavior, investigates why users convert, stall, or churn, and hands you a queue of drafted actions.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Current Free plan: web workspace, CLI, MCP, and desktop clients using your own model keys or local Ollama inference; hosted scheduling and hosted models are not included."
          },
          {
            "@type": "Offer",
            "name": "Solo",
            "price": "99",
            "priceCurrency": "USD",
            "description": "Always-on cloud runtime with hosted models: 3,000 sessions watched and 20 deep dives a month."
          },
          {
            "@type": "Offer",
            "name": "Team",
            "price": "249",
            "priceCurrency": "USD",
            "description": "12,000 sessions watched and 60 deep dives a month, with hourly sweeps."
          }
        ],
        "creator": {
          "@type": "Organization",
          "name": "Eventools LLC",
          "url": "https://eventools.io"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is Postshow different from PostHog or Amplitude?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "They tell you what happened. Postshow starts where the dashboard ends: it watches the sessions behind the numbers, works out why they moved, and hands you a drafted action. PostHog is one of its launch connectors."
            }
          },
          {
            "@type": "Question",
            "name": "Which models does Postshow use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your choice, per task: Anthropic, OpenAI, Kimi, GLM, DeepSeek, Grok, Mistral, any OpenAI-compatible endpoint, or local models through Ollama. You set the model and effort for each kind of work."
            }
          },
          {
            "@type": "Question",
            "name": "What does Postshow cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The current Free plan uses your own keys or local models and is open source. Hosted is $99/mo (Solo) or $249/mo (Team), with current self-service terms based on sessions watched and deep dives rather than tokens."
            }
          },
          {
            "@type": "Question",
            "name": "Is Postshow open source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open core: the app, CLI, MCP server, desktop agent, and engine are MIT licensed; the always-on cloud runtime and billing are the paid product."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
