            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Postshow does not replace product analytics. Its closed-beta goal is to turn corroborating behavior into a customer incident that connects replay evidence, affected accounts, revenue, suspected product cause, proposed interventions, and the measured result. PostHog is the initial behavior source."

            }
          },
          {
            "@type": "Question",

            "acceptedAnswer": {
              "@type": "Answer",

            }
          },

            "@type": "Question",
            "name": "Is Postshow open source?",
