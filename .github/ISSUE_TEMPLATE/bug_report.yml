name: Bug report
description: Report a reproducible problem in an open Postshow component.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, private logs, or an unpatched security vulnerability. Use SUPPORT.md for private hosted-service help and SECURITY.md for vulnerabilities.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web client
        - Desktop client
        - CLI or local runtime
        - MCP server
        - Shared engine
        - Documentation
        - Other open-source component
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use a release version, package version, or full commit SHA.
      placeholder: 0.1.0 or 0123456789abcdef...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, Node version, and install method where relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give exact, repeatable steps with synthetic or sanitized data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only the minimum safe logs or screenshots needed to reproduce the bug.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials, personal data, customer content, or private service logs.
          required: true
        - label: This is not an unpatched security vulnerability.
          required: true
