name: Dependency Audit Backstop

# Daily sweep so a critical advisory published against an unchanged dependency
# surfaces without waiting for a PR to trigger the CI audit job.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit-backstop
  cancel-in-progress: false

jobs:
  audit:
    name: Audit main
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit all release and runtime dependencies
        run: pnpm audit --audit-level low
