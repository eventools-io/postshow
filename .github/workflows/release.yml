name: Legacy Release (retired)

# This path is intentionally inert. The hardened publisher lives in
# publish-release.yml under a new workflow identity. Operators must also disable
# historical workflow ID 316997874 before stable tags are permitted.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Historical publisher is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse legacy publication
        shell: bash
        run: |
          echo 'This workflow path is retired and cannot publish. Use Publish Release.' >&2
          exit 1
