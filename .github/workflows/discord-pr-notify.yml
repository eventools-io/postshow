name: Discord PR Notifications

on:
  pull_request:
    types: [opened, closed]
    branches: [main]

permissions: {}

concurrency:
  group: discord-pr-notify-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PR Opened Notification
        if: github.event.action == 'opened'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          node --input-type=module <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.log('DISCORD_PR_WEBHOOK is not configured; skipping PR opened notification.');
            process.exit(0);
          }

          const content = [
            '**New PR Opened (postshow)**',
            '',
            `**[${process.env.PR_TITLE}](${process.env.PR_URL})**`,
            '',
            `\`${process.env.PR_HEAD_REF}\` -> \`${process.env.PR_BASE_REF}\``,
            `Author: ${process.env.PR_AUTHOR}`,
          ].join('\n');

          const response = await fetch(webhook, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ content }),
          });

          if (!response.ok) {
            throw new Error(`Discord webhook failed with status ${response.status}`);
          }
          NODE

      - name: PR Merged Notification
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          node --input-type=module <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.log('DISCORD_PR_WEBHOOK is not configured; skipping PR merged notification.');
            process.exit(0);
          }

          const content = [
            '**PR Merged (postshow)**',
            '',
            `**[${process.env.PR_TITLE}](${process.env.PR_URL})**`,
            '',
            `\`${process.env.PR_HEAD_REF}\` -> \`${process.env.PR_BASE_REF}\``,
            `Merged by: ${process.env.PR_MERGED_BY}`,
          ].join('\n');

          const response = await fetch(webhook, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ content }),
          });

          if (!response.ok) {
            throw new Error(`Discord webhook failed with status ${response.status}`);
          }
          NODE
