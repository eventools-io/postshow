name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux jobs run on the eventools self-hosted pool while this repo is private
# (via the CI_GENERAL_RUNNER_LABELS_JSON repo variable). When the repo goes
# public, DELETE that variable so jobs fall back to GitHub-hosted
# ubuntu-latest - fork PRs must never reach self-hosted runners.
jobs:
  quality:
    name: Quality (lint, types, tests, builds)
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test
      - name: Build everything
        run: pnpm build
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: postshow-site
          path: apps/postshow/dist
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  unslop:
    name: Unslop Checks
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gate added lines for AI-slop tells
        # Pinned to the commit behind v0.2.0; diff-aware, added lines only.
        uses: cj-vana/unslop-ci@7e31097c8525f273b622a48eaae4a0b80a11c515

  pr-title:
    name: Conventional PR Title
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check title
        run: |
          echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z]' \
            || { echo "PR title must be conventional: type(scope): lowercase subject"; exit 1; }
