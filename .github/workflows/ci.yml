name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pull requests always use GitHub-hosted runners because they execute contributor
# code. Trusted pushes may use the private eventools pool when the variable is set.
jobs:
  quality:
    name: Quality (lint, types, tests, builds)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Lint GitHub Actions workflows
        # Exact commit behind actionlint v1.7.12 plus a checksum-pinned
        # ShellCheck 0.11.0, so embedded shell is checked without runner drift.
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -rf "$tools_dir"' EXIT
          shellcheck_archive="$tools_dir/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$shellcheck_archive"
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$shellcheck_archive" | sha256sum -c -
          tar -xJf "$shellcheck_archive" -C "$tools_dir"
          "$tools_dir/shellcheck-v0.11.0/shellcheck" --version
          # GitHub's current concurrency syntax supports queue:max, but
          # actionlint 1.7.12 still exposes the older two-key schema. Ignore
          # only that exact schema-lag message; every other finding still fails.
          go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca \
            -ignore='^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$' \
            -shellcheck="$tools_dir/shellcheck-v0.11.0/shellcheck" \
            .github/workflows/*.yml
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test
      - name: Build everything
        run: pnpm build
      - name: Upload site build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postshow-site
          path: apps/postshow/dist
          overwrite: true
          retention-days: 7

  e2e:
    name: Browser Journey (Playwright)
    # The unit suite renders in happy-dom, so nothing else here proves the
    # routed, lazily loaded app boots in an engine for a signed-in reviewer.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install the Chromium build Playwright pins
        run: pnpm --filter @eventools/postshow exec playwright install --with-deps chromium
      - name: Walk the incident review spine
        run: pnpm test:e2e
      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postshow-e2e-trace
          path: apps/postshow/test-results
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.CI_GENERAL_RUNNER_LABELS_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit all release and runtime dependencies
        run: pnpm audit --audit-level low

  unslop:
    name: Unslop Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gate added lines for AI-slop tells
        # Pinned to the commit behind v0.2.0; diff-aware, added lines only.
        uses: cj-vana/unslop-ci@7e31097c8525f273b622a48eaae4a0b80a11c515

  pr-title:
    name: Conventional PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check title
        run: |
          echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|deps|revert)(\([a-z0-9-]+\))?!?: [a-z]' \
            || { echo "PR title must be conventional: type(scope): lowercase subject"; exit 1; }
